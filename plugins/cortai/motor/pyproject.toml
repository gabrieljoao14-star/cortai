[project]
name = "corta"
version = "0.6.2"
description = "Motor de edição de vídeo do Cortaí: silêncio, takes, legenda e verificação. Roda no Mac e no Windows."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1,<2",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pillow>=10.3",
    "psutil>=5.9",
    "opencv-python-headless>=4.9,<5",
    # trilha composta: só onde há versão pronta (Mac Apple, Windows, Linux). Mac Intel teria de compilar.
    "tinysoundfont>=0.3.7; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[project.optional-dependencies]
# limpeza de voz "forte" (IA). Pesada: só instala quando a pessoa escolhe.
forte = ["demucs>=4.0.1", "torch>=2.2", "torchaudio>=2.2"]

[project.scripts]
corta = "corta.cli:main"

[tool.uv]
# o tinysoundfont pede o pyaudio só para tocar som ao vivo (o Cortaí nunca usa); o pyaudio não tem versão
# pronta para Mac e quebrava a instalação num Mac limpo (teste do GitHub, 24/10)
override-dependencies = ["pyaudio; sys_platform == 'nunca'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corta"]

[dependency-groups]
dev = ["pytest>=8"]
